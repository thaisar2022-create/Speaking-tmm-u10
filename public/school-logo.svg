<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5a1571"/>
      <stop offset="70%" stop-color="#460d58"/>
      <stop offset="100%" stop-color="#380847"/>
    </radialGradient>
    <radialGradient id="flowerCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb700"/>
      <stop offset="50%" stop-color="#ffd000"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>

  <!-- Subtle watermark Thai consonants background -->
  <g fill="#ffffff" opacity="0.045" font-family="system-ui, sans-serif" font-weight="bold" font-size="28" text-anchor="middle">
    <text x="80" y="70">ก</text>
    <text x="160" y="60">ข</text>
    <text x="240" y="80">ค</text>
    <text x="320" y="60">ง</text>
    <text x="400" y="75">จ</text>
    <text x="450" y="130">ฉ</text>
    
    <text x="60" y="140">ช</text>
    <text x="140" y="130">ซ</text>
    <text x="380" y="140">ญ</text>
    <text x="460" y="200">ฎ</text>
    
    <text x="50" y="220">ด</text>
    <text x="100" y="280">ต</text>
    <text x="460" y="290">ถ</text>
    <text x="420" y="360">ท</text>
    
    <text x="60" y="360">น</text>
    <text x="120" y="420">บ</text>
    <text x="200" y="450">ป</text>
    <text x="280" y="460">ผ</text>
    <text x="360" y="440">ฝ</text>
    <text x="430" y="420">พ</text>
  </g>

  <!-- Yellow Stylized Calligraphy text -->
  <g filter="url(#softGlow)">
    <!-- First glyph group (approx stylized Burmese သ/ယ with tail) -->
    <path d="M 85 270 C 85 240 100 220 120 220 C 135 220 148 232 155 248 C 162 232 178 220 195 220 C 218 220 235 242 235 270 C 235 300 215 320 190 320 C 170 320 156 308 150 292 C 145 310 130 320 110 320 C 92 320 85 300 85 270 Z" fill="#ffef00"/>
    <path d="M 120 238 C 108 238 98 250 98 270 C 98 288 106 302 118 302 C 130 302 138 290 140 274 C 138 252 130 238 120 238 Z" fill="url(#bgGrad)"/>
    <path d="M 200 238 C 188 238 178 250 176 272 C 178 290 188 302 200 302 C 212 302 222 288 222 270 C 222 250 212 238 200 238 Z" fill="url(#bgGrad)"/>
    
    <!-- Vertical tail under first glyph with bird/beak shape -->
    <path d="M 148 300 C 145 320 144 345 144 365 C 144 372 146 376 150 376 C 158 376 170 365 174 365 C 172 373 162 382 150 382 C 136 382 132 370 132 360 C 132 335 135 305 138 300 Z" fill="#ffef00"/>

    <!-- Flourish stroke rising above -->
    <path d="M 270 240 C 265 200 275 165 285 145 C 275 160 260 205 258 235 Z" fill="#ffef00"/>
    
    <!-- Second glyph (crescent/ear shape: င်/ဒ with rising flame) -->
    <path d="M 225 245 C 235 210 260 170 285 145 C 283 158 272 195 268 220 C 275 210 290 205 300 215 C 315 228 305 260 288 275 C 275 285 260 292 245 292 C 235 292 225 285 225 275 C 225 265 235 255 248 255 C 255 255 265 260 268 268 C 280 258 285 242 278 232 C 272 226 260 230 252 240 Z" fill="#ffef00"/>

    <!-- Third glyph: ဇ / ည double arc -->
    <path d="M 275 265 C 275 245 288 235 300 235 C 310 235 318 242 322 252 C 328 242 338 235 348 235 C 362 235 372 248 372 265 C 372 282 360 295 345 295 C 335 295 328 288 322 278 C 318 288 310 295 298 295 C 285 295 275 282 275 265 Z" fill="#ffef00"/>
    <circle cx="298" cy="265" r="11" fill="url(#bgGrad)"/>
    <circle cx="348" cy="265" r="11" fill="url(#bgGrad)"/>

    <!-- Fourth glyph: စ / ဝ circular loop with flick -->
    <path d="M 335 265 C 335 235 355 220 380 220 C 405 220 425 238 425 265 C 425 292 405 310 380 310 C 355 310 335 292 335 265 Z" fill="#ffef00"/>
    <circle cx="380" cy="265" r="24" fill="url(#bgGrad)"/>
    <!-- Center flick inside fourth glyph -->
    <path d="M 385 252 C 395 255 398 268 392 276 C 388 272 388 262 385 252 Z" fill="#ffef00"/>
    
    <!-- Extended flame swirl trailing to top right -->
    <path d="M 235 245 C 242 210 268 165 285 145 C 282 165 265 210 252 248 Z" fill="#ffef00"/>
  </g>

  <!-- Realistic Plumeria (Frangipani) Flower on top left -->
  <g transform="translate(142, 192) rotate(-15) scale(0.95)" filter="url(#softGlow)">
    <!-- 5 Petals of white frangipani with soft radial curve -->
    <!-- Petal 1 (top) -->
    <path d="M 0 0 C -15 -35 -20 -60 0 -75 C 20 -60 15 -35 0 0 Z" fill="#ffffff" stroke="#f4e8f8" stroke-width="0.5"/>
    <!-- Petal 2 (top right) -->
    <path d="M 0 0 C 25 -30 55 -40 70 -20 C 58 5 32 10 0 0 Z" fill="#ffffff" stroke="#f4e8f8" stroke-width="0.5"/>
    <!-- Petal 3 (bottom right) -->
    <path d="M 0 0 C 35 15 55 45 40 68 C 18 62 10 35 0 0 Z" fill="#ffffff" stroke="#f4e8f8" stroke-width="0.5"/>
    <!-- Petal 4 (bottom left) -->
    <path d="M 0 0 C -5 35 -30 60 -55 48 C -55 25 -30 10 0 0 Z" fill="#ffffff" stroke="#f4e8f8" stroke-width="0.5"/>
    <!-- Petal 5 (top left) -->
    <path d="M 0 0 C -35 0 -65 -15 -62 -40 C -40 -50 -15 -25 0 0 Z" fill="#ffffff" stroke="#f4e8f8" stroke-width="0.5"/>

    <!-- Golden yellow center of flower -->
    <circle cx="0" cy="0" r="26" fill="url(#flowerCenter)"/>
    <circle cx="0" cy="0" r="12" fill="#ffaa00" opacity="0.6"/>
  </g>
</svg>